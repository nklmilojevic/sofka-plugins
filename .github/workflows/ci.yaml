name: CI

on:
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.changes.outputs.plugins }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          changes="$(uv run --locked python scripts/catalog.py changes --base "$BASE" --head "$HEAD" --mode test)"
          echo "plugins=$(jq -c .plugins <<<"$changes")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c .matrix <<<"$changes")" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - name: Validate catalog and sources
        run: uv run --locked python scripts/catalog.py validate
      - name: Test catalog validation
        run: uv run --locked python scripts/test_catalog.py
      - name: Reject replacement or modification of a published version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: uv run --locked python scripts/catalog.py assert-unpublished --base "$BASE" --head "$HEAD"
      # No workspace member lives outside plugins/, so a change that selects no
      # plugin has no Rust to compile.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: needs.changes.outputs.plugins != '[]'
        with:
          components: clippy, rustfmt
      - name: Check formatting
        if: needs.changes.outputs.plugins != '[]'
        run: cargo fmt --all -- --check
      - name: Lint adapters
        if: needs.changes.outputs.plugins != '[]'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test adapters
        if: needs.changes.outputs.plugins != '[]'
        run: cargo test --locked --workspace
      - name: Test activity with mock tools and broken stderr
        if: needs.changes.outputs.plugins != '[]'
        run: |
          cargo build --locked --workspace
          uv run --locked python scripts/test_activity.py

  build:
    needs: [changes, validate]
    if: needs.changes.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build, test, and package adapter
        env:
          PLUGIN: ${{ matrix.plugin }}
          TARGET: ${{ matrix.target }}
        run: uv run --locked python scripts/build_adapter.py --plugin "$PLUGIN" --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.plugin }}-${{ matrix.target }}
          path: ${{ matrix.plugin }}-*.tar.zst
