name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.changes.outputs.plugins }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the BLAKE3 wheel
        run: pip install --no-deps -r scripts/requirements.txt
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changes="$(python3 scripts/catalog.py changes --base "$BASE" --head "$HEAD" --mode test)"
          echo "plugins=$(jq -c .plugins <<<"$changes")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c .matrix <<<"$changes")" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the BLAKE3 wheel
        run: pip install --no-deps -r scripts/requirements.txt
      - name: Validate catalog and sources
        run: python3 scripts/catalog.py validate
      - name: Test catalog validation
        run: python3 scripts/test_catalog.py
      - name: Reject replacement or modification of a published version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/catalog.py assert-unpublished --base "$BASE" --head "$HEAD"
      # No workspace member lives outside plugins/, so a change that selects no
      # plugin has no Rust to compile.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: needs.changes.outputs.plugins != '[]'
        with:
          components: clippy, rustfmt
      - name: Check formatting
        if: needs.changes.outputs.plugins != '[]'
        run: cargo fmt --all -- --check
      - name: Lint adapters
        if: needs.changes.outputs.plugins != '[]'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test adapters
        if: needs.changes.outputs.plugins != '[]'
        run: cargo test --locked --workspace

  build:
    needs: [changes, validate]
    if: needs.changes.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the BLAKE3 wheel
        run: pip install --no-deps -r scripts/requirements.txt
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build adapter
        run: cargo build --release --locked --package "sofka-plugin-${{ matrix.plugin }}" --target "${{ matrix.target }}"
      - name: Test adapter fixture
        env:
          PLUGIN: ${{ matrix.plugin }}
          TARGET: ${{ matrix.target }}
        run: |
          "target/$TARGET/release/sofka-plugin-$PLUGIN" < "plugins/$PLUGIN/fixtures/request.json" > report.json
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2]))' report.json "plugins/$PLUGIN/fixtures/report.json"
      - name: Build deterministic package
        env:
          PLUGIN: ${{ matrix.plugin }}
          TARGET: ${{ matrix.target }}
        run: |
          version="$(python3 scripts/catalog.py version --plugin "$PLUGIN")"
          python3 scripts/catalog.py package \
            --plugin "$PLUGIN" \
            --target "$TARGET" \
            --binary "target/$TARGET/release/sofka-plugin-$PLUGIN" \
            --output "$PLUGIN-$version-$TARGET.tar.zst"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.plugin }}-${{ matrix.target }}
          path: ${{ matrix.plugin }}-*.tar.zst
