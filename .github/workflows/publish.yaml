name: Publish changed plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin ID to publish from main
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "plugins/**"

defaults:
  run:
    shell: bash

permissions:
  contents: read

# Runs share the release tags and the per-commit catalog branch, so they are
# serialised rather than left to race. A publication is never cancelled part
# way through.
concurrency:
  group: publish-plugins
  cancel-in-progress: false

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.changes.outputs.plugins }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - id: changes
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PLUGIN: ${{ inputs.plugin }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changes="$(uv run --locked python scripts/catalog.py manual-publication --plugin "$PLUGIN")"
          else
            changes="$(uv run --locked python scripts/catalog.py changes --base "$BASE" --head "$HEAD" --mode publish)"
          fi
          echo "plugins=$(jq -c .plugins <<<"$changes")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c .matrix <<<"$changes")" >> "$GITHUB_OUTPUT"
      - name: Reject replacement or modification of a published version
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: uv run --locked python scripts/catalog.py assert-unpublished --base "$BASE" --head "$HEAD"

  validate:
    needs: changes
    if: needs.changes.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - run: uv run --locked python scripts/catalog.py validate
      - run: uv run --locked python scripts/test_catalog.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  build:
    needs: [changes, validate]
    if: needs.changes.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build, test, and package adapter
        env:
          PLUGIN: ${{ matrix.plugin }}
          TARGET: ${{ matrix.target }}
        run: uv run --locked python scripts/build_adapter.py --plugin "$PLUGIN" --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.plugin }}-${{ matrix.target }}
          path: ${{ matrix.plugin }}-*.tar.zst

  publish:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGINS_JSON: ${{ needs.changes.outputs.plugins }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Attest package bytes
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.zst
      - name: Publish immutable release assets
        run: |
          for plugin in $(jq -r '.[]' <<<"$PLUGINS_JSON"); do
            version="$(uv run --locked python scripts/catalog.py version --plugin "$plugin")"
            tag="$plugin-v$version"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" dist/$plugin-$version-*.tar.zst \
                --target "$SOURCE_COMMIT" \
                --title "$plugin $version" \
                --notes "Reviewed sofka plugin package $plugin $version."
            fi
            mkdir -p "published/$plugin"
            gh release download "$tag" --pattern "$plugin-$version-*.tar.zst" --dir "published/$plugin"
            for asset in dist/$plugin-$version-*.tar.zst; do
              cmp "$asset" "published/$plugin/$(basename "$asset")"
            done
          done
      - name: Generate catalog entry from published bytes
        run: |
          mapfile -t plugins < <(jq -r '.[]' <<<"$PLUGINS_JSON")
          uv run --locked python scripts/catalog.py update-index --commit "$SOURCE_COMMIT" --assets dist "${plugins[@]}"
          uv run --locked python scripts/catalog.py validate
      - name: Open reviewed catalog update
        run: |
          branch="catalog/publish-${SOURCE_COMMIT:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A merged catalog pull request means this commit's publication is
          # already complete. Catalog generation refreshes `generated_at` on
          # every run, so without this a rerun would open a timestamp-only
          # pull request over work that has already landed.
          state="$(gh pr view "$branch" --json state --jq .state 2>/dev/null || echo NONE)"
          if [ "$state" = "MERGED" ]; then
            echo "catalog entry for $SOURCE_COMMIT is already merged; nothing to publish."
            exit 0
          fi
          git switch -c "$branch"
          git add index.json
          # `generated_at` moves on every run, so compare everything else: a
          # timestamp is not a publication.
          if uv run --locked python - <<'PY'
          import json, subprocess, sys
          new = json.load(open("index.json"))
          old = json.loads(subprocess.run(
              ["git", "show", "HEAD:index.json"], capture_output=True, text=True, check=True
          ).stdout)
          new.pop("generated_at", None)
          old.pop("generated_at", None)
          sys.exit(0 if new == old else 1)
          PY
          then
            echo "index.json already records these assets; nothing to publish."
            exit 0
          fi
          git commit -m "chore: publish plugin catalog entries"
          # The branch name is derived from the source commit and its content is
          # regenerated from the published bytes, so a re-run after a failed
          # attempt replaces whatever that attempt left behind rather than
          # trusting it. Without this, a stale branch would be proposed in place
          # of the entry just generated.
          git push --force origin "HEAD:refs/heads/$branch"
          # The state read before the push can have moved while this run was
          # working, so it is read again here rather than reused. A
          # closed-but-unmerged pull request still answers `gh pr view`, and the
          # published assets stay undiscoverable until an open pull request
          # carries this index.
          ensure_open_pull_request() {
            case "$(gh pr view "$branch" --json state --jq .state 2>/dev/null || echo NONE)" in
              OPEN)
                echo "a pull request for $branch is already open."
                ;;
              MERGED)
                echo "the pull request for $branch merged while this run was publishing."
                ;;
              CLOSED)
                gh pr reopen "$branch"
                ;;
              *)
                gh pr create \
                  --base main \
                  --head "$branch" \
                  --title "chore: publish plugin catalog entries" \
                  --body "Publishes the reviewed plugin assets built from $SOURCE_COMMIT. The release assets existed and matched these recorded BLAKE3 digests before this pull request was opened. Implements https://github.com/nklmilojevic/sofka/issues/502 as agreed in https://github.com/nklmilojevic/sofka/discussions/501."
                ;;
            esac
          }
          # If another run opened or reopened it first, the second read sees
          # that and succeeds: the pull request existing is the goal, not this
          # run being the one to create it.
          ensure_open_pull_request || ensure_open_pull_request
