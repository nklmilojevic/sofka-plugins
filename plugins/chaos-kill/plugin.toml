schema_version = 2

[package]
display_name = "Chaos kill"
version = "0.1.1"
authors = ["vyrti"]
license = "MIT OR Apache-2.0"
description = "Delete pods of the selected workload and measure how long it takes to become ready again."
repository = "https://github.com/nklmilojevic/sofka-plugins"
readme = "README.md"
sofka = ">=0.27.1"
platforms = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
tags = ["chaos", "resiliency", "testing", "report"]

[[commands]]
name = "Chaos kill"
palette = "chaos-kill"
command = "./adapter"
args = []
requires = ["kubectl"]
install = "Install kubectl from https://kubernetes.io/docs/tasks/tools/"
# Only workloads that replace their own pods. A bare pod has nothing to recover
# it, so killing one is a delete, not a test.
scopes = ["deployments", "statefulsets", "daemonsets"]
target = "selection"
output = "report"
# Deletes running pods: blocked in read-only mode, confirmed and marked every
# time, and refusable per namespace through a `plugin:chaos-kill` guardrail.
mutating = true
confirm = true
dangerous = true
timeout = "6m"

[commands.inputs.dry_run]
type = "boolean"
default = "true"

[commands.inputs.count]
type = "integer"
default = "1"
min = 1
max = 10

[commands.inputs.wait]
type = "duration"
default = "120s"
max = 300
