schema_version = 2

[package]
display_name = "Trivy scan"
version = "0.1.3"
authors = ["vyrti"]
license = "MIT OR Apache-2.0"
description = "Scan the active context with Trivy and report vulnerabilities, misconfigurations, and secrets."
repository = "https://github.com/nklmilojevic/sofka-plugins"
readme = "README.md"
sofka = ">=0.27.4"
platforms = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
tags = ["security", "vulnerabilities", "report", "audit"]

[[commands]]
name = "Trivy scan"
palette = "trivy"
command = "./adapter"
args = []
requires = ["trivy"]
install = "Install Trivy from https://trivy.dev/latest/getting-started/installation/"
output = "report"
target = "context"
mutating = false
timeout = "30m"

[commands.inputs.scan]
type = "string"
default = "all"
choices = ["all", "misconfig"]

[commands.inputs.report]
type = "string"
default = ""
