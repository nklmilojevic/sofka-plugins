schema_version = 2

[package]
display_name = "Resource summary"
version = "0.1.2"
authors = ["nklmilojevic"]
license = "MIT OR Apache-2.0"
description = "Show identity, context, and optionally labels for the selected Kubernetes resource."
repository = "https://github.com/nklmilojevic/sofka-plugins"
readme = "README.md"
sofka = ">=0.27.4"
platforms = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
tags = ["example", "report", "resources"]

[[commands]]
name = "Resource summary"
palette = "resource-summary"
command = "./adapter"
args = []
requires = []
output = "report"
mutating = false
timeout = "10s"

[commands.inputs.detail]
type = "boolean"
default = "false"
